name: Tests d'accessibilité RGAA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs à analyser (séparées par des espaces)"
        required: false

jobs:
  rgaa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution des tests RGAA
        run: |
          if [ -n "${{ github.event.inputs.urls }}" ]; then
            ARGS=""
            for u in ${{ github.event.inputs.urls }}; do ARGS="$ARGS --url $u"; done
            node bin/rgaa-ci.js $ARGS --output rgaa-report
          else
            node bin/rgaa-ci.js --config rgaa.config.json
          fi

      - name: Publication des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-rgaa
          path: rgaa-report/
